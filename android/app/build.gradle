plugins {
    id 'com.android.application'
}

// The release signing key lives outside the repository. CI provides it through the
// ANDROID_SIGNING secret (see .github/workflows/android.yml); without it the release build is
// signed with the throwaway debug key and is never published.
def releaseKeystore = System.getenv('FORYOU_KEYSTORE')

// Firebase (push notifications, so calls ring while the app is closed). google-services.json comes from
// the Firebase console; its values are public by design (every app built with it contains them). The
// app reads them as BuildConfig fields instead of using the Google Services Gradle plugin, so the debug
// build (com.foryou.chat.debug) doesn't need its own Firebase registration. Without the file, push is off.
def firebase = [enabled: false, appId: '', apiKey: '', projectId: '', sender: '']
def googleServices = file('google-services.json')
if (googleServices.exists()) {
    def gs = new groovy.json.JsonSlurper().parse(googleServices)
    def client = gs.client.find { it.client_info.android_client_info.package_name == 'com.foryou.chat' } ?: gs.client[0]
    firebase = [
        enabled  : true,
        appId    : client.client_info.mobilesdk_app_id,
        apiKey   : client.api_key[0].current_key,
        projectId: gs.project_info.project_id,
        sender   : gs.project_info.project_number,
    ]
}

android {
    namespace 'com.foryou.chat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foryou.chat'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
        buildConfigField 'boolean', 'PUSH_ENABLED', firebase.enabled ? 'true' : 'false'
        buildConfigField 'String', 'FCM_APP_ID', "\"${firebase.appId}\""
        buildConfigField 'String', 'FCM_API_KEY', "\"${firebase.apiKey}\""
        buildConfigField 'String', 'FCM_PROJECT_ID', "\"${firebase.projectId}\""
        buildConfigField 'String', 'FCM_SENDER_ID', "\"${firebase.sender}\""
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('FORYOU_KEYSTORE_PASSWORD')
                keyAlias 'foryou'
                keyPassword System.getenv('FORYOU_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
