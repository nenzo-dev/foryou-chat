<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForYou bridge test</title>
<style>body { background: #07070a; color: #f5f4f0; font-family: monospace; padding: 16px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<h3>ForYou bridge test (debug build only)</h3>
<pre id="out"></pre>
<script>
  // Exercises window.ForYouAndroid the way the web app does. Run by android/ci/emulator-test.sh.
  var out = document.getElementById('out');
  function log(s) { out.textContent += s + '\n'; console.log(s); }
  var b = window.ForYouAndroid;
  if (!b) { log('NO BRIDGE'); }
  else {
    log('info ' + b.info());
    // A call that came by push and was answered from the notification waits here for the page.
    log('pending ' + (b.takePendingCall() || 'none'));
    // A message and a call while the app is out of sight (as soon as the test sends it to the
    // background), then the call ends when it's back on screen. The timers are a fallback.
    var KEY = '0123456789abcdef0123456789abcdef', rang = false, ended = false;
    function ring() {
      if (rang) return;
      rang = true;
      b.notify('Test Ann', 'Hello from the bridge test', 'foryou-dm-test', '#/chat/test');
      log('notified');
      b.incomingCall(JSON.stringify({ roomKey: KEY, name: 'Test Caller' }));
      log('ringing');
    }
    function end() {
      if (!rang || ended) return;
      ended = true;
      b.endIncomingCall(KEY);
      log('call ended');
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') ring(); else end();
    });
    setTimeout(ring, 6000);
    setTimeout(end, 30000);
    b.registerDevice(JSON.stringify({ url: 'https://test-not-a-real-project.supabase.co', key: 'test-key', token: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef', user: '00000000-0000-0000-0000-000000000001' }));
    log('device registered');
    b.setInCall(true);
    log('in call');
  }
</script>
</body>
</html>
